# /etc/nginx/sites-available/mtrend.kz
# SSL: certbot --nginx -d mtrend.kz -d www.mtrend.kz

server {
    listen 80;
    server_name mtrend.kz www.mtrend.kz;
    return 301 https://mtrend.kz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.mtrend.kz;
    ssl_certificate     /etc/letsencrypt/live/mtrend.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtrend.kz/privkey.pem;
    return 301 https://mtrend.kz$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mtrend.kz;

    ssl_certificate     /etc/letsencrypt/live/mtrend.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mtrend.kz/privkey.pem;

    client_max_body_size 30m;   # загрузка фото и Excel в админке
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # ВАЖНО: перезаписываем X-Forwarded-For реальным IP — на нём основаны лимиты запросов
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;    # большой импорт из 1С
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
