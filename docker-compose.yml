# Запуск на VPS: docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mtrend
      POSTGRES_USER: mtrend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtrend"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mtrend:${POSTGRES_PASSWORD}@db:5432/mtrend?schema=public
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads:/app/storage/uploads
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # Служебный контейнер для seed, создания администратора, импорта 1С из файлов:
  #   docker compose run --rm tools npm run db:seed
  tools:
    build:
      context: .
      target: build
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://mtrend:${POSTGRES_PASSWORD}@db:5432/mtrend?schema=public
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
